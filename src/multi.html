<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多字符串发送</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="multi-body">
  <div id="multi-titlebar">
    <div class="titlebar-drag" data-tauri-drag-region>
      <img class="titlebar-icon" src="icons/app-icon.png" alt="" draggable="false" />
      <span class="titlebar-title" data-i18n="multi.title">多字符串发送</span>
    </div>
    <div class="titlebar-controls">
      <button id="multi-btn-pin" class="title-btn" title="窗口置顶" data-i18n-title="titlebar.pin"><i data-lucide="pin"></i></button>
      <button id="multi-btn-minimize" class="title-btn" title="最小化" data-i18n-title="titlebar.minimize"><i data-lucide="minus"></i></button>
      <button id="multi-btn-close" class="title-btn" title="关闭" data-i18n-title="common.close"><i data-lucide="x"></i></button>
    </div>
  </div>

  <div id="multi-toolbar">
    <label class="chk-label">
      <input type="checkbox" id="multi-chk-loop" /> <span data-i18n="multi.loop">循环发送</span>
    </label>
    <button id="multi-btn-add" class="small-btn"><i data-lucide="plus"></i> <span data-i18n="multi.add">添加</span></button>
    <button id="multi-btn-del-all" class="small-btn"><i data-lucide="trash-2"></i> <span data-i18n="multi.deleteAll">全部删除</span></button>
    <button id="multi-btn-export" class="small-btn"><i data-lucide="upload"></i> <span data-i18n="multi.exportJson">导出 JSON</span></button>
    <button id="multi-btn-import" class="small-btn"><i data-lucide="download"></i> <span data-i18n="multi.importJson">导入 JSON</span></button>
  </div>

  <div id="multi-list"></div>

  <script type="module" src="js/multi.js"></script>
</body>
</html>
